# maneyko.com server configuration
# This file is linked to: /etc/nginx/sites-enabled/maneyko.com.conf

# vim: ft=nginx

log_format apm '{'
    '"@timestamp":"$time_iso8601",'
    '"@time_ms":"$msec",'
    '"scheme":"$scheme",'
    '"client":"$remote_addr",'
    '"method":"$request_method",'
    '"http_host":"$http_host",'
    '"request":"$request",'
    '"request_length":"$request_length",'
    '"args":"$args",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer",'
    '"status":"$status",'
    '"bytes_sent":"$bytes_sent",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"server_name":"$server_name",'
    '"server_port":"$server_port",'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"request_time":"$request_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time"'
    '}';

# Undefined subdomains return 404
server {
    server_name *.maneyko.com;
    listen 80;
    listen [::]:80;
    return 404;
}
server {
  server_name *.maneyko.com;
  include snippets/ssl-maneyko.com.conf;
  return 404;
}

# Redirect all HTTP traffic to HTTPS
server {
    server_name maneyko.com www.maneyko.com;

    listen 80;
    listen [::]:80;

    if ($host = www.maneyko.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = maneyko.com) {
        return 301 https://$host$request_uri;
    }

    return 404;
}

server {
    # server_name ~^(?<subdomain>[^.]+_).maneyko.com maneyko.com www.maneyko.com;
    server_name maneyko.com www.maneyko.com;

    include snippets/ssl-maneyko.com.conf;

    log_subrequest on;
    access_log /var/log/nginx/maneyko.com.log apm;

    root /var/www/maneyko.com;
    index index.php;

    location ~* ^(/config|/etc|/private|/scripts|/vendor|README*|/.git*|/.env*|/composer*) {
        deny all;
        return 404;
    }

    location @php_rewrite {
        rewrite ^(.*)$ $1.php last;
    }

    location / {
        try_files $uri $uri/ @php_rewrite;
        default_type text/plain;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;

        # With php-fpm (or other unix sockets):
        fastcgi_pass unix:/var/run/php/php-fpm.sock;

        # With php-cgi (or other tcp sockets):
        # fastcgi_pass 127.0.0.1:9000;
    }

    location ~ ^/rails/(.*)$ {
        proxy_pass_request_headers on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;

        proxy_pass http://127.0.0.1:3000/$1$is_args$args;
    }
}

# Set up basic proxy pass subdomain
server {
    server_name rails.maneyko.com;

    include snippets/ssl-maneyko.com.conf;
    include snippets/proxy-headers.conf;

    location / {
        proxy_pass_request_headers on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;

        proxy_pass http://127.0.0.1:3000;
    }
}
